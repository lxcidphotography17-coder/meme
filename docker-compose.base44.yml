services:
  app:
    image: python:3.12-slim
    working_dir: /app
    volumes:
      - .:/app
    ports:
      - "3000:3000"
    environment:
      - BASE44_PREVIEW_MODE
      - PYTHONUNBUFFERED=1
    env_file:
      - /run/base44/app.env
    command: ["sh", "-ec", "pip install --no-cache-dir -r requirements.txt && sh /app/start.sh"]
    restart: on-failure
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:3000/', timeout=3).read()"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 40s
